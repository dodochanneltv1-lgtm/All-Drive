<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Cloud - Hi-Tech Drive</title>
    <style>
        /* CSS Reset & Variables */
        :root {
            /* 🌙 Dark Mode (Cyberpunk Neon) */
            --bg-deep: #050b14;
            --bg-panel: rgba(13, 17, 28, 0.75);
            --neon-blue: #00e5ff;
            --neon-purple: #a600ff;
            --text-main: #e2e8f0;
            --text-muted: #8b9bb4;
            --grid-line: rgba(0, 229, 255, 0.04);
            --border-card: rgba(0, 229, 255, 0.15);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --card-hover-bg: rgba(13, 17, 28, 0.95);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-border: rgba(255, 255, 255, 0.1);
            --title-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            --glass-blur: blur(10px);
        }

        /* ☀️ Light Mode (Clean Corporate Sci-Fi) */
        body.light-mode {
            --bg-deep: #f0f4f8;
            --bg-panel: #ffffff;
            --neon-blue: #0055ff;
            --neon-purple: #5e00ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --grid-line: rgba(15, 23, 42, 0.03);
            --border-card: rgba(0, 85, 255, 0.2);
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --card-hover-bg: #ffffff;
            --btn-bg: #e2e8f0;
            --btn-border: #cbd5e1;
            --title-shadow: none;
            --glass-blur: none;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
            background-color: var(--bg-deep);
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* 1. View Controller */
        .view-section {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 0; visibility: hidden; display: flex; flex-direction: column;
        }
        .view-section.active {
            opacity: 1; visibility: visible; transform: scale(1) translateY(0);
        }
        #gridView { transform: translateY(15px); overflow-y: auto; padding-bottom: 50px; }
        #iframeView { transform: translateY(50px); }

        /* 2. Grid View Design (หน้าแรก) */
        .header { text-align: center; margin: 60px 0 30px 0; position: relative; }
        .brand-title {
            font-size: 3.2em; font-weight: 900; margin: 0; text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-main);
            text-shadow: var(--title-shadow);
            transition: all 0.4s ease;
        }
        .header p { color: var(--neon-blue); font-size: 1em; letter-spacing: 2px; font-weight: 600; margin-top: 10px; }

        /* ปุ่มสลับธีม สไตล์ Switch */
        .theme-toggle-btn {
            position: absolute; top: 25px; right: 30px;
            background: var(--bg-panel);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 13px; letter-spacing: 1px;
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            transition: all 0.3s; z-index: 100;
            box-shadow: var(--card-shadow);
        }
        .theme-toggle-btn:hover { border-color: var(--neon-blue); transform: translateY(-2px); }
        .theme-toggle-btn span { font-size: 16px; }

        .drive-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; max-width: 1300px; margin: 0 auto; padding: 20px;
        }

        /* การ์ดลื่นไหล (Hardware Acceleration) */
        .drive-card {
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 24px 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transform: translateZ(0); /* ลดแลค */
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }
        
        .drive-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-blue);
            opacity: 0.3; transition: all 0.3s ease;
        }
        
        .drive-card:hover {
            transform: translateY(-6px) translateZ(0);
            background: var(--card-hover-bg);
            border-color: var(--neon-blue);
        }
        body:not(.light-mode) .drive-card:hover {
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.2);
        }
        body.light-mode .drive-card:hover {
            box-shadow: 0 12px 24px rgba(0, 85, 255, 0.15);
        }
        .drive-card:hover::before { opacity: 1; width: 6px; }

        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
        .folder-icon { font-size: 38px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .folder-name { font-weight: 700; font-size: 1.15em; color: var(--text-main); }

        /* แถบพื้นที่ */
        .storage-info { margin-top: 15px; }
        .storage-text { display: flex; justify-content: space-between; font-size: 0.85em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .storage-text .highlight { color: var(--neon-blue); }
        
        .storage-bar-bg {
            width: 100%; height: 6px; background: rgba(128, 128, 128, 0.15);
            border-radius: 10px; overflow: hidden;
        }
        .storage-bar-fill {
            height: 100%; border-radius: 10px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            width: 0%; transition: width 1s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        /* 3. Iframe View */
        .top-bar { 
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-panel); 
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-card); 
            z-index: 10; 
        }
        .drive-title-bar { 
            font-size: 1.2em; font-weight: 800; display: flex; align-items: center; gap: 12px;
            color: var(--neon-blue); text-transform: uppercase;
        }
        
        .action-group { display: flex; gap: 12px; }
        .btn-action { 
            border: 1px solid transparent; color: var(--text-main); padding: 10px 20px; border-radius: 8px; 
            font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; 
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
        }
        
        .back-btn { background: var(--btn-bg); border-color: var(--btn-border); }
        .back-btn:hover { background: var(--btn-border); border-color: var(--text-muted); }
        
        .upload-btn { background: rgba(166, 0, 255, 0.1); border-color: var(--neon-purple); color: var(--neon-purple); }
        .upload-btn:hover { background: var(--neon-purple); color: #fff; }
        
        .refresh-btn { background: rgba(0, 229, 255, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); }
        .refresh-btn:hover { background: var(--neon-blue); color: #fff; }

        .iframe-wrapper { flex-grow: 1; padding: 20px; box-sizing: border-box; display: flex; }
        .iframe-container { 
            flex-grow: 1; background: #fff; border-radius: 12px; 
            overflow: hidden; display: flex; border: 2px solid var(--border-card);
            box-shadow: var(--card-shadow);
        }
        iframe { width: 100%; height: 100%; border: none; flex-grow: 1; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }
        
        /* Loading Skeleton */
        .skeleton { color: transparent !important; background: linear-gradient(90deg, rgba(128,128,128,0.1) 25%, rgba(128,128,128,0.2) 50%, rgba(128,128,128,0.1) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div id="gridView" class="view-section active">
        <!-- ปุ่มสลับธีม -->
        <button id="themeToggleBtn" class="theme-toggle-btn">
            <span id="themeIcon">☀️</span> <span id="themeText">LIGHT</span>
        </button>

        <div class="header">
            <h1 class="brand-title">Nexus Core</h1>
            <p>SECURE STORAGE PROTOCOL</p>
        </div>
        <div class="drive-container" id="gridContainer">
            <!-- การ์ดจะถูกสร้างด้วย JS (Lazy Load) -->
        </div>
    </div>

    <div id="iframeView" class="view-section">
        <div class="top-bar">
            <button id="backBtn" class="btn-action back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                BACK
            </button>
            <div class="drive-title-bar">
                <span id="currentIcon"></span> <span id="currentName">LINKING...</span>
            </div>
            <div class="action-group">
                <button id="refreshBtn" class="btn-action refresh-btn">SYNC 🔄</button>
                <button id="uploadBtn" class="btn-action upload-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    UPLOAD
                </button>
            </div>
        </div>
        <div class="iframe-wrapper">
            <div class="iframe-container">
                <iframe id="driveFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ระบบจัดการธีม ---
        const themeBtn = document.getElementById('themeToggleBtn');
        const body = document.body;
        
        function updateThemeUI(isLight) {
            document.getElementById('themeIcon').innerText = isLight ? '🌙' : '☀️';
            document.getElementById('themeText').innerText = isLight ? 'DARK' : 'LIGHT';
        }

        if (localStorage.getItem('nexusTheme') === 'light') {
            body.classList.add('light-mode');
            updateThemeUI(true);
        }

        themeBtn.onclick = () => {
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            localStorage.setItem('nexusTheme', isLight ? 'light' : 'dark');
            updateThemeUI(isLight);
        };

        // --- 2. ข้อมูล Drive ทั้งหมด 31 ตัว ---
        const myDrives = [
            { name: "Drive 0 (มหาลัย)", link: "https://drive.google.com/drive/folders/11li0rNAkKu-b50r8aNGs6WqD9RopX6Wm?usp=sharing", icon: "📚" },
            { name: "Drive 1 (รูปภาพ)", link: "https://drive.google.com/drive/folders/1SJ7M8Kzv-em0yu8oNpvXkRiS803Z_SMu?usp=sharing", icon: "📸" },
            { name: "Drive 2 (Zip and Other)", link: "https://drive.google.com/drive/folders/14j4ZjYP2TfMv2cep22Cp-j_C3fercosv?usp=sharing", icon: "📁" },
            { name: "Drive 3 (วีดีโอ)", link: "https://drive.google.com/drive/folders/1IM60BDw-YgM_t517LwUORVRFBPj3dwsV?usp=sharing", icon: "🎞️" },
            { name: "Drive 4 (หนัง/อนิเมะ)", link: "https://drive.google.com/drive/folders/1WhZlAXkjLz90SlcffSDM9kPBgWT3EM5H?usp=sharing", icon: "🍿" },
            { name: "Drive 5 (เพลง)", link: "https://drive.google.com/drive/folders/1616IdVYKYg9QExi3pok6EsulTk4FjdNA?usp=sharing", icon:"♫"},
            { name: "Drive 6", link: "https://drive.google.com/drive/folders/1VIJ20ugS51e7SfthUea2a2fAxl78U9wZ?usp=sharing", icon: "🗂️"},
            { name: "Drive 7", link: "https://drive.google.com/drive/folders/1-X7SbOStEqjKoY4JJUkvqSXEUhcB9tK9?usp=sharing", icon: "🗂️"},
            { name: "Drive 8", link: "https://drive.google.com/drive/folders/1thfJcI8Ayu-qEWE6hp_KghGwplN3K670?usp=sharing", icon: "🗂️"},
            { name: "Drive 9", link: "https://drive.google.com/drive/folders/1_hTYLBK3wJetZBWPMgnp6obODhP578TG?usp=sharing", icon: "🗂️"},
            { name: "Drive 10", link: "https://drive.google.com/drive/folders/1lfvsrrRE9amYURm4cO742HTd4zWNjASh?usp=sharing", icon: "🗂️"},
            { name: "Drive 11", link: "https://drive.google.com/drive/folders/1zS-djiEQcMdKji1KFuqkw8IDH1D8RvvV?usp=sharing", icon: "🗂️"},
            { name: "Drive 12", link: "https://drive.google.com/drive/folders/1PPGpv6j_2pGjmi14_e7iR-DEIpXDpP2p?usp=sharing", icon: "🗂️"},
            { name: "Drive 13", link: "https://drive.google.com/drive/folders/1UfNHJTJlgKe9YcXYzEftF51FMWQuuWKf?usp=sharing", icon: "🗂️"},
            { name: "Drive 14", link: "https://drive.google.com/drive/folders/1TRn4W1Rd8W8AumKsUYnAKX6qR-PVj2jV?usp=sharing", icon: "🗂️"},
            { name: "Drive 15", link: "https://drive.google.com/drive/folders/1TkY1EQKuM3Dl9kMdeJx2ThkjkAUOQZQ5?usp=sharing", icon: "🗂️"},
            { name: "Drive 16", link: "https://drive.google.com/drive/folders/1jZl-nRJk9YOELS_0f5YQ1pV-K1qVVEQZ?usp=sharing", icon: "🗂️"},
            { name: "Drive 17", link: "https://drive.google.com/drive/folders/13LpFlLh6tnLJPT88_P9vNBphoFrl7Ej4?usp=sharing", icon: "🗂️"},
            { name: "Drive 18", link: "https://drive.google.com/drive/folders/1Gru45Z183DQfnI3mA8G2zG1fH0bJgwVJ?usp=sharing", icon: "🗂️"},
            { name: "Drive 19", link: "https://drive.google.com/drive/folders/1UtyG5Vc9andefLgm8qCFy7-fLypODp-H?usp=sharing", icon: "🗂️"},
            { name: "Drive 20", link: "https://drive.google.com/drive/folders/1oT66HK7nWhIpl6lyS2L-PO5Ok5AEU5Ko?usp=sharing", icon: "🗂️"},
            { name: "Drive 21", link: "https://drive.google.com/drive/folders/1faeuSpS4qxZg2oiRYT7uY5T2MHmgNG7z?usp=sharing", icon: "🗂️"},
            { name: "Drive 22", link: "https://drive.google.com/drive/folders/1Uy5uwWFt0sIGMZlI4FaLfLs1i7KX4zfZ?usp=sharing", icon: "🗂️"},
            { name: "Drive 23", link: "https://drive.google.com/drive/folders/1KJel7BqHWIqhOcQe-8ZoM2w8aRqXrYpO?usp=sharing", icon: "🗂️"},
            { name: "Drive 24", link: "https://drive.google.com/drive/folders/1PNJOu_V3x1KKtRMUzQX_D5RMADUdlHL1?usp=sharing", icon: "🗂️"},
            { name: "Drive 25", link: "https://drive.google.com/drive/folders/15NeaJxU_W8N8sm1V6eTQYkH73D-vd5TP?usp=sharing", icon: "🗂️"},
            { name: "Drive 26", link: "https://drive.google.com/drive/folders/11LtMXaRskKe3ygVJMmOGG_IyebV9bkvq?usp=sharing", icon: "🗂️"},
            { name: "Drive 27", link: "https://drive.google.com/drive/folders/11LegdZP0xG3wokh57Ht_ksyWPjGOnfD1?usp=sharing", icon: "🗂️"},
            { name: "Drive 28", link: "https://drive.google.com/drive/folders/1ncBpmcb_tpEIDf-CUO953mb7UB8iSAPj?usp=sharing", icon: "🗂️"},
            { name: "Drive 29", link: "https://drive.google.com/drive/folders/15Qj6Eu_CwaKu0oCMAV_6htnX4l_GzMyh?usp=sharing", icon: "🗂️"},
            { name: "Drive 30", link: "https://drive.google.com/drive/folders/1l9Nmtj5aolHCjgD7WsfH_3ezQp6hfCCB?usp=sharing", icon: "🗂️"}
        ];

        // --- 3. สร้าง UI & Lazy Loading API (แก้ปัญหาแลค) ---
        const gridContainer = document.getElementById('gridContainer');
        const gasUrl = "https://script.google.com/macros/s/AKfycbxgJ6Wn6WBbzgmXyzqIEQVjbcMyBDIz5LsNh_CuOnzIXUkPpkXZmz7hS1Q1-pWM_D7Hgw/exec"; 
        const fragment = document.createDocumentFragment();

        // สร้าง Observer สำหรับเช็คว่าการ์ดไหนกำลังถูกมองเห็น
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const folderId = card.dataset.folderId;
                    
                    if (folderId && !card.dataset.loaded) {
                        card.dataset.loaded = "true"; // มาร์คว่าโหลดแล้ว จะได้ไม่โหลดซ้ำ
                        fetchDriveSize(folderId, card);
                    }
                }
            });
        }, { rootMargin: '100px' }); // โหลดล่วงหน้าก่อนเลื่อนถึง 100px

        myDrives.forEach((drive) => {
            const folderIdMatch = drive.link.match(/[-\w]{25,}/);
            const folderId = folderIdMatch ? folderIdMatch[0] : "";
            
            const card = document.createElement('div');
            card.className = "drive-card";
            if (folderId) card.dataset.folderId = folderId;
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="folder-icon">${drive.icon}</div>
                    <div class="folder-name">${drive.name}</div>
                </div>
                <div class="storage-info">
                    <div class="storage-text">
                        <span class="storage-status skeleton">SCANNING DATA</span>
                    </div>
                    <div class="storage-bar-bg">
                        <div class="storage-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>
            `;

            card.onclick = () => openDrive(drive.name, drive.icon, drive.link, folderId);
            fragment.appendChild(card);
            
            // ให้ Observer จับตาดูการ์ดนี้
            if(folderId) observer.observe(card);
        });

        gridContainer.appendChild(fragment);

        // --- 4. ฟังก์ชันดึงข้อมูลพื้นที่ (ทำงานเฉพาะตัวที่เห็นหน้าจอ) ---
        async function fetchDriveSize(folderId, cardElement) {
            try {
                const res = await fetch(`${gasUrl}?folderId=${folderId}`);
                const data = await res.json();
                
                const statusElement = cardElement.querySelector('.storage-status');
                const barFill = cardElement.querySelector('.storage-bar-fill');
                
                if(!data.error) {
                    statusElement.classList.remove('skeleton');
                    statusElement.innerHTML = `Used <span class="highlight">${data.formattedSize}</span>`;
                    
                    const maxDriveSize = 15 * 1024 * 1024 * 1024; // 15GB
                    let percent = (data.totalBytes / maxDriveSize) * 100;
                    barFill.style.width = `${Math.min(percent, 100)}%`;
                    
                    if(percent > 85) {
                        barFill.style.background = 'linear-gradient(90deg, #ff0055, #ffaa00)';
                    }
                }
            } catch(err) {
                cardElement.querySelector('.storage-status').innerHTML = "OFFLINE";
                cardElement.querySelector('.storage-status').classList.remove('skeleton');
            }
        }

        // --- 5. Navigation Control ---
        const gridView = document.getElementById('gridView');
        const iframeView = document.getElementById('iframeView');
        const frame = document.getElementById('driveFrame');
        let currentActiveLink = "";

        function openDrive(name, icon, link, folderId) {
            if (!folderId) return alert("⚠️ ERROR: INVALID LINK");
            
            currentActiveLink = link;
            document.getElementById('currentName').innerText = name;
            document.getElementById('currentIcon').innerText = icon;
            
            gridView.classList.remove('active');
            setTimeout(() => {
                iframeView.classList.add('active');
                frame.src = `https://drive.google.com/embeddedfolderview?id=${folderId}#list`;
            }, 300);

            document.getElementById('uploadBtn').onclick = () => {
                const w = 900, h = 600;
                const left = (screen.width - w) / 2, top = (screen.height - h) / 2;
                window.open(link, "Upload", `width=${w},height=${h},top=${top},left=${left}`);
            };
        }

        document.getElementById('backBtn').onclick = () => {
            iframeView.classList.remove('active');
            setTimeout(() => {
                gridView.classList.add('active');
                frame.src = ""; 
            }, 300);
        };

        document.getElementById('refreshBtn').onclick = () => {
            const folderIdMatch = currentActiveLink.match(/[-\w]{25,}/);
            if (folderIdMatch) frame.src = `https://drive.google.com/embeddedfolderview?id=${folderIdMatch[0]}#list`;
        };
    </script>
</body>
</html>
